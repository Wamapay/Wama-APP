<!doctype html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Learn &amp; Earn — Platform Preview</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;600;700&family=Inter:wght@400;500;600;700&family=IBM+Plex+Mono:wght@500;600&family=Playfair+Display:wght@700;800;900&family=Great+Vibes&display=swap" rel="stylesheet">
<script src="https://cdnjs.cloudflare.com/ajax/libs/react/18.2.0/umd/react.production.min.js"></script>

<style>
  :root{
    --ink:#14171A; --paper:#FFFFFF; --mist:#F5F5F3; --border:#E8E6E1; --muted:#74797E;
    --accent:#146B4B; --accentDeep:#0F5239;
    --blue: var(--accent); --blueDeep: var(--accentDeep); --green: var(--accent); --greenDeep: var(--accentDeep);
    --gold:#B98900; --goldDeep:#8F6B00;
  }
  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;}
  body{
    background:var(--paper); color:var(--ink); -webkit-font-smoothing:antialiased;
    font-family:'Inter',sans-serif; font-size:15px; line-height:1.65;
  }
  h1,h2,h3,h4{font-family:'Space Grotesk',sans-serif; margin:0; color:var(--ink); letter-spacing:-.02em;}
  a{color:inherit; text-decoration:none;}
  button{font-family:inherit; cursor:pointer;}
  input{font-family:inherit;}
  ::selection{background:rgba(20,107,79,.16);}
  :focus-visible{outline:2px solid var(--accent); outline-offset:2px; border-radius:4px;}

  .container-page{max-width:1180px; margin:0 auto; padding:0 20px; width:100%;}
  .flex{display:flex;} .grid{display:grid;}
  .items-center{align-items:center;} .items-start{align-items:flex-start;}
  .justify-between{justify-content:space-between;} .justify-center{justify-content:center;}
  .flex-col{flex-direction:column;} .flex-wrap{flex-wrap:wrap;}
  .flex-1{flex:1;} .shrink-0{flex-shrink:0;} .min-w-0{min-width:0;}
  .text-center{text-align:center;} .truncate{overflow:hidden;text-overflow:ellipsis;white-space:nowrap;}
  .w-full{width:100%;} .relative{position:relative;} .sticky{position:sticky;}

  .g1{gap:4px;} .g2{gap:8px;} .g3{gap:12px;} .g4{gap:16px;} .g5{gap:20px;} .g6{gap:24px;} .g8{gap:32px;}
  .mb1{margin-bottom:4px;} .mb2{margin-bottom:8px;} .mb3{margin-bottom:12px;} .mb4{margin-bottom:16px;}
  .mb5{margin-bottom:20px;} .mb6{margin-bottom:24px;} .mb8{margin-bottom:32px;}
  .mt1{margin-top:4px;} .mt2{margin-top:8px;} .mt3{margin-top:12px;} .mt4{margin-top:16px;}
  .mt5{margin-top:20px;} .mt6{margin-top:24px;}
  .p3{padding:12px;} .p4{padding:16px;} .p5{padding:20px;} .p6{padding:24px;} .p7{padding:28px;} .p8{padding:32px;}
  .py2{padding-top:8px;padding-bottom:8px;} .py3{padding-top:12px;padding-bottom:12px;}
  .py8{padding-top:32px;padding-bottom:32px;} .py10{padding-top:40px;padding-bottom:40px;}
  .px4{padding-left:16px;padding-right:16px;}

  .space-y > * + *{margin-top:16px;}
  .space-y-sm > * + *{margin-top:10px;}
  .space-y-lg > * + *{margin-top:24px;}

  .text-xs{font-size:12px;} .text-sm{font-size:13.5px;} .text-base{font-size:15px;}
  .text-lg{font-size:18px;} .text-xl{font-size:22px;} .text-2xl{font-size:26px;} .text-3xl{font-size:32px;}
  .font-medium{font-weight:500;} .font-semibold{font-weight:600;} .font-bold{font-weight:700;}
  .font-display{font-family:'Space Grotesk',sans-serif;} .font-mono{font-family:'IBM Plex Mono',monospace;}
  .muted{color:var(--muted);}
  .text-blue{color:var(--blue);} .text-green{color:var(--green);} .text-red{color:#dc2626;} .text-gold{color:var(--goldDeep);}

  .rounded-lg{border-radius:8px;} .rounded-xl{border-radius:12px;} .rounded-full{border-radius:999px;}

  .card{background:#fff; border:1px solid var(--border); border-radius:12px; box-shadow:none;}
  .card-dashed{border-style:dashed; background:var(--mist);}

  .btn{display:inline-flex; align-items:center; justify-content:center; gap:8px; border-radius:9px; font-weight:600; font-size:13.5px; border:none; transition:all .15s; white-space:nowrap;}
  .btn:disabled{opacity:.5; pointer-events:none;}
  .btn-lg{padding:14px 24px; font-size:15px; border-radius:10px;}
  .btn-md{padding:10px 20px;}
  .btn-sm{padding:8px 14px; font-size:12.5px;}
  .btn-primary{background:var(--ink); color:#fff;}
  .btn-primary:hover{background:var(--accentDeep);}
  .btn-secondary{background:#fff; color:var(--ink); border:1px solid var(--border);}
  .btn-secondary:hover{border-color:rgba(20,23,26,.3); background:var(--mist);}
  .btn-ghost{background:transparent; color:var(--ink);}
  .btn-ghost:hover{background:var(--mist);}
  .btn-danger{color:#dc2626;} .btn-danger:hover{background:#fef2f2;}

  .input-field{width:100%; border-radius:9px; border:1px solid var(--border); background:#fff; padding:12px 14px; font-size:13.5px; color:var(--ink); outline:none; transition:border-color .15s;}
  .input-field::placeholder{color:var(--muted);}
  .input-field:focus{border-color:var(--accent); box-shadow:0 0 0 3px rgba(20,107,79,.10);}
  .input-error{border-color:#f87171 !important;}
  .label-field{display:block; font-size:13px; font-weight:500; color:var(--ink); margin-bottom:6px;}

  .eyebrow{display:inline-flex; align-items:center; gap:6px; font-size:11px; font-weight:600; text-transform:uppercase; letter-spacing:.06em; color:var(--muted);}

  .switch{position:relative; display:inline-block; width:40px; height:24px; flex-shrink:0;}
  .switch input{opacity:0; width:0; height:0;}
  .switch .slider{position:absolute; cursor:pointer; inset:0; background:#D9D7D2; border-radius:999px; transition:.15s;}
  .switch .slider:before{position:absolute; content:""; height:18px; width:18px; left:3px; top:3px; background:#fff; border-radius:999px; transition:.15s; box-shadow:0 1px 2px rgba(20,23,26,.2);}
  .switch input:checked + .slider{background:var(--accent);}
  .switch input:checked + .slider:before{transform:translateX(16px);}
  .switch input:disabled + .slider{opacity:.5; cursor:not-allowed;}
  .settings-tabs{display:flex; gap:6px; overflow-x:auto; padding-bottom:2px; -webkit-overflow-scrolling:touch;}
  .settings-tab{display:inline-flex; align-items:center; gap:6px; white-space:nowrap; padding:9px 14px; border-radius:9px; font-size:13px; font-weight:600; border:1px solid var(--border); background:#fff; color:var(--muted);}
  .settings-tab.active{background:var(--ink); color:#fff; border-color:var(--ink);}
  .settings-row{display:flex; align-items:flex-start; justify-content:space-between; gap:16px; padding:14px 0; border-bottom:1px solid var(--border);}
  .settings-row:last-child{border-bottom:none;}
  .badge{display:inline-flex; align-items:center; gap:4px; border-radius:999px; padding:5px 10px; font-size:11.5px; font-weight:600;}
  .badge-blue{background:#EAF3EE; color:var(--accentDeep);}
  .badge-green{background:#EAF3EE; color:var(--accentDeep);}
  .badge-gold{background:#FAF5E9; color:var(--goldDeep);}
  .badge-red{background:#fef2f2; color:#dc2626;}

  .checkbox{height:16px; width:16px; border-radius:4px; border:1px solid var(--border); accent-color:var(--accent); margin-top:2px;}

  @keyframes fadeIn{from{opacity:0; transform:translateY(-4px);} to{opacity:1; transform:translateY(0);}}
  @keyframes spin{to{transform:rotate(360deg);}}
  .spin{animation:spin 1s linear infinite;}
  .fade-in{animation:fadeIn .15s ease-out;}

  /* Recent Buyers strip — quiet ticker, consistent with the flat minimal system. */
  @keyframes billboardEnter{
    0%{opacity:0; transform:translateY(6px);}
    100%{opacity:1; transform:translateY(0);}
  }
  @keyframes billboardPulse{
    0%,100%{opacity:1;}
    50%{opacity:.4;}
  }
  .billboard{
    position:relative; overflow:hidden; border-radius:12px;
    background:var(--mist);
    border:1px solid var(--border);
  }
  .billboard::before{ content:none; }
  .billboard-scanline{ display:none; }
  .billboard-dot{
    height:7px; width:7px; border-radius:999px; background:var(--accent);
    animation:billboardPulse 1.6s ease-in-out infinite;
  }
  .billboard-slide{animation:billboardEnter .4s ease-out;}
  .billboard-glow-green{color:var(--accentDeep); font-weight:600; text-shadow:none;}
  .billboard-glow-gold{color:var(--goldDeep); font-weight:600; text-shadow:none;}
  .billboard-video{position:absolute; inset:0; width:100%; height:100%; object-fit:cover; z-index:0; opacity:.85; transform:scale(1.35); transform-origin:center 40%;}
  .billboard-video-overlay{position:absolute; inset:0; z-index:0; background:linear-gradient(100deg,rgba(6,11,20,.92) 0%,rgba(6,11,20,.72) 42%,rgba(6,11,20,.3) 75%,rgba(6,11,20,.12) 100%);}

  .dashboard-shell{display:grid; grid-template-columns:240px 1fr; gap:32px; align-items:start;}
  .dashboard-mobile-nav{display:none;}
  @media(max-width:720px){
    .dashboard-shell{grid-template-columns:1fr;}
    .dashboard-mobile-nav{display:flex;}
  }
  .dashboard-mobile-nav{
    gap:8px; overflow-x:auto; padding-bottom:10px; margin-bottom:16px; -webkit-overflow-scrolling:touch;
  }
  .dashboard-mobile-nav::-webkit-scrollbar{display:none;}
  .dashboard-mobile-link{
    flex-shrink:0; display:flex; align-items:center; gap:6px; padding:9px 14px; border-radius:999px;
    font-size:12.5px; font-weight:600; white-space:nowrap; border:1px solid var(--border); color:rgba(11,18,32,.7); background:#fff;
  }
  .dashboard-mobile-link.active{background:var(--green); border-color:var(--green); color:#fff;}
  .dashboard-mobile-link.locked{color:rgba(11,18,32,.35); background:var(--mist);}

  .split-220{display:grid; grid-template-columns:220px 1fr;}
  .split-r300{display:grid; grid-template-columns:1fr 300px;}
  .split-l300{display:grid; grid-template-columns:300px 1fr;}
  @media(max-width:720px){
    .split-220,.split-r300,.split-l300{grid-template-columns:1fr;}
  }

  .navbar{position:sticky; top:0; z-index:40; background:rgba(255,255,255,.92); backdrop-filter:blur(8px); border-bottom:1px solid var(--border);}
  .nav-link{padding:8px 12px; font-size:13.5px; font-weight:500; border-radius:10px; color:rgba(11,18,32,.7);}
  .nav-link:hover{background:var(--mist); color:var(--ink);}
  .nav-link.active{background:rgba(20,107,79,.12); color:var(--green);}

  .mobile-bottom-nav{display:none;}
  @media(max-width:720px){
    .mobile-bottom-nav{
      display:flex; position:fixed; left:0; right:0; bottom:0; z-index:44;
      background:#fff; border-top:1px solid var(--border);
      border-radius:24px 24px 0 0;
      padding:18px 6px calc(10px + env(safe-area-inset-bottom));
      box-shadow:0 -14px 32px -18px rgba(11,18,32,.28);
    }
    .mobile-bottom-nav-inner{display:flex; flex:1; justify-content:space-around;}
    .mobile-bottom-link{
      display:flex; flex-direction:column; align-items:center; gap:6px;
      font-size:12.5px; font-weight:600; color:rgba(11,18,32,.4);
      padding:2px 10px 8px;
    }
    .mobile-bottom-link svg{ width:24px; height:24px; }
    .mobile-bottom-link.active{color:var(--green); position:relative;}
    .mobile-bottom-link.active::after{
      content:""; position:absolute; bottom:0; left:50%; transform:translateX(-50%);
      height:3px; width:26px; border-radius:3px; background:var(--green);
    }
    main.has-bottom-nav{padding-bottom:82px;}
  }

  .sidebar-link{display:flex; align-items:center; gap:10px; border-radius:10px; padding:10px 12px; font-size:13.5px; font-weight:500; color:rgba(11,18,32,.7);}
  .sidebar-link:hover{background:var(--mist); color:var(--ink);}
  .sidebar-link.active{background:#EAF3EE; color:var(--blue);}

  .otp-box{height:48px; width:42px; text-align:center; font-size:18px; font-family:'IBM Plex Mono',monospace; font-weight:600; border-radius:10px; border:1px solid var(--border); outline:none;}
  .otp-box:focus{border-color:var(--blue); box-shadow:0 0 0 3px rgba(20,107,79,.12);}
  .otp-error{border-color:#f87171 !important; box-shadow:0 0 0 3px rgba(248,113,113,.15) !important; color:#dc2626;}
  .otp-success{border-color:var(--green) !important; box-shadow:0 0 0 3px rgba(20,107,79,.15) !important; color:var(--green);}

  .avatar{border-radius:999px; background:var(--mist); border:1px solid var(--border); display:grid; place-items:center; color:var(--muted); overflow:hidden; flex-shrink:0;}
  .avatar img{width:100%; height:100%; object-fit:cover;}

  .divider{height:1px; background:var(--border); border:none;}

  .toast-wrap{position:fixed; top:16px; right:16px; z-index:200; display:flex; flex-direction:column; gap:8px; max-width:340px;}
  .toast{display:flex; align-items:flex-start; gap:10px; border-radius:12px; border:1px solid; padding:14px; box-shadow:0 4px 8px rgba(11,18,32,.06), 0 16px 32px -12px rgba(11,18,32,.16);}
  .toast-success{background:#EAF3EE; border-color:#a7f3d0; color:#065f46;}
  .toast-error{background:#fef2f2; border-color:#fecaca; color:#991b1b;}
  .toast-info{background:#EAF3EE; border-color:#bfdbfe; color:#1e3a8a;}

  .grid-2{grid-template-columns:repeat(2,1fr);}
  .grid-3{grid-template-columns:repeat(3,1fr);}
  .grid-4{grid-template-columns:repeat(4,1fr);}
  @media(max-width:900px){ .grid-4{grid-template-columns:repeat(2,1fr);} }
  @media(max-width:720px){ .grid-2{grid-template-columns:1fr;} .grid-3{grid-template-columns:repeat(2,1fr);} .hide-mobile{display:none !important;} }
  @media(max-width:360px){ .grid-3{grid-template-columns:1fr;} }
  @media(min-width:721px){ .hide-desktop{display:none !important;} }

  .strength-bar{height:6px; border-radius:999px; flex:1; background:var(--mist);}
  .product-thumb{height:110px; border-radius:10px; display:flex; align-items:center; justify-content:center; color:#fff;}

  .dropdown{position:absolute; right:0; margin-top:8px; width:260px; border-radius:14px; border:1px solid var(--border); background:#fff; box-shadow:0 4px 8px rgba(11,18,32,.06), 0 16px 32px -12px rgba(11,18,32,.16); padding:6px 0; z-index:60;}
  .dropdown-item{display:flex; align-items:center; gap:10px; padding:10px 16px; font-size:13.5px; color:rgba(11,18,32,.8);}
  .dropdown-item:hover{background:var(--mist); color:var(--ink);}

  .skeleton{background:var(--mist); border-radius:8px;}

  /* Verified Promoter blue check (Stage 8) — small, circular, X-style. */
  .verified-check{display:inline-flex; align-items:center; justify-content:center; position:relative; cursor:pointer; border-radius:999px; line-height:0; flex-shrink:0;}
  .verified-check:focus-visible{outline:2px solid var(--blue); outline-offset:2px;}
  .verified-tooltip{position:absolute; left:50%; bottom:calc(100% + 9px); transform:translateX(-50%); width:216px; background:var(--ink); color:#fff; font-size:11.5px; line-height:1.5; font-weight:500; padding:10px 12px; border-radius:10px; box-shadow:0 8px 24px -8px rgba(11,18,32,.4); z-index:80; text-align:left; cursor:default;}
  .verified-tooltip::after{content:""; position:absolute; top:100%; left:50%; transform:translateX(-50%); border:6px solid transparent; border-top-color:var(--ink);}
  .verified-tooltip strong{display:block; font-size:12px; margin-bottom:2px; color:#fff; font-family:'Space Grotesk',sans-serif;}

  /* Agent Certificate (Stage 8) */
  .certificate{background:#fffdf7; border-radius:18px; padding:36px; position:relative; overflow:hidden;}
  .certificate::before{content:""; position:absolute; inset:14px; border:2px solid var(--gold); border-radius:10px; pointer-events:none; z-index:3;}
  .certificate::after{content:""; position:absolute; inset:19px; border:1px solid rgba(201,147,4,.5); border-radius:7px; pointer-events:none; z-index:3;}
  .certificate-seal{height:60px; width:60px; border-radius:999px; background:linear-gradient(135deg, var(--blue), var(--blueDeep)); display:grid; place-items:center; color:#fff; flex-shrink:0; box-shadow:0 6px 16px -4px rgba(20,107,79,.5);}
  .certificate-signature{border-top:1.5px solid var(--ink); padding-top:6px; margin-top:34px;}
  .certificate-sig-name{font-family:'Great Vibes',cursive; font-size:30px; color:var(--ink); line-height:1; display:block; margin-bottom:2px;}
  .certificate-serif{font-family:'Playfair Display',serif;}
  .certificate-photo-box{
    width:104px; height:120px; border:2px dashed var(--border); border-radius:10px; background:var(--mist);
    display:flex; align-items:center; justify-content:center; overflow:hidden; flex-shrink:0;
  }
  .certificate-stat-value{border-bottom:2px solid var(--gold); display:inline-block; padding-bottom:4px;}
  @media(max-width:560px){ .certificate{padding:22px;} .certificate::before{inset:10px;} .certificate::after{inset:14px;} }

  /* ---------------------------------------------------------------
     Global mobile hardening — keeps every screen inside the viewport
     on small phones, with tighter spacing/type so nothing feels
     cramped or requires horizontal scrolling.
     --------------------------------------------------------------- */
  html,body{overflow-x:hidden; width:100%;}
  img,svg,video{max-width:100%;}
  * { word-break: break-word; overflow-wrap: break-word; }
  table{display:block; overflow-x:auto; -webkit-overflow-scrolling:touch;}

  @media(max-width:600px){
    .container-page{padding:0 14px;}
    .p5{padding:16px;} .p6{padding:16px;} .p7{padding:18px;} .p8{padding:20px;}
    .py8{padding-top:22px;padding-bottom:22px;} .py10{padding-top:26px;padding-bottom:26px;}
    .g6{gap:14px;} .g8{gap:18px;}
    .text-3xl{font-size:24px;} .text-2xl{font-size:21px;} .text-xl{font-size:18px;} .text-lg{font-size:16px;}
    .btn-lg{padding:12px 18px; font-size:14px;}
    .dashboard-shell{gap:16px;}
    .split-220,.split-r300,.split-l300{gap:16px;}
    .card{border-radius:12px;}
    .toast-wrap{left:12px; right:12px; max-width:none;}
  }
  .grid-dash-a{display:grid; grid-template-columns:1.6fr 1fr; gap:24px;}
  .grid-dash-b{display:grid; grid-template-columns:1.1fr 1fr; gap:24px;}
  @media(max-width:760px){ .grid-dash-a,.grid-dash-b{grid-template-columns:1fr;} }
  .dash-mobile-grid{display:none;}
  @media(max-width:720px){
    .dash-mobile-grid{display:grid; grid-template-columns:repeat(4,1fr); gap:10px;}
  }
  @media(max-width:480px){
    .dash-mobile-grid{gap:8px;}
  }
  .dash-mobile-card{border-radius:14px; padding:12px 10px; position:relative; overflow:hidden; text-align:left;}
  .dash-mobile-card .dmc-icon{height:32px; width:32px; border-radius:10px; display:grid; place-items:center; margin-bottom:10px;}
  .dash-mobile-card .dmc-arrow{position:absolute; top:16px; right:14px; color:rgba(20,23,26,.35);}
  .dash-mobile-card .dmc-title{font-weight:700; font-size:12.5px; margin-bottom:2px; white-space:nowrap; overflow:hidden; text-overflow:ellipsis;}
  .dash-mobile-card .dmc-sub{font-size:11px; color:var(--muted); margin-bottom:8px; white-space:nowrap; overflow:hidden; text-overflow:ellipsis;}
  .dash-mobile-card .dmc-link{font-size:11px; font-weight:700; display:inline-flex; align-items:center; gap:4px;}
  @media(max-width:420px){
    .container-page{padding:0 12px;}
    .p5{padding:14px;} .p6{padding:14px;} .p7{padding:16px;} .p8{padding:16px;}
    body{font-size:14px;}
    .text-3xl{font-size:21px;} .text-2xl{font-size:19px;}
    .btn-md{padding:9px 16px;} .btn-lg{padding:11px 16px; font-size:13.5px;}
  }
</style>
</head>

/* ---------------------------------------------------------------- */
/* Purchase / checkout helpers                                       */
/* ---------------------------------------------------------------- */
function formatGHS(amount) {
  const n = Number(amount) || 0;
  return "GH₵" + n.toLocaleString("en-US", { minimumFractionDigits: 2, maximumFractionDigits: 2 });
}
function formatOrderDate(d) {
  try {
    return new Date(d + "T00:00:00").toLocaleDateString("en-GB", { day: "numeric", month: "short", year: "numeric" });
  } catch (e) {
    return d;
  }
}
// Real order/payment timestamps are full ISO datetimes (createdAt/paidAt),
// unlike the old demo "YYYY-MM-DD" purchaseDate string.
function formatOrderDateTime(iso) {
  if (!iso) return "—";
  try {
    return new Date(iso).toLocaleString("en-GB", { day: "numeric", month: "short", year: "numeric", hour: "2-digit", minute: "2-digit" });
  } catch (e) {
    return String(iso);
  }
}
function genReference() {
  return "LE" + Date.now().toString(36).toUpperCase().slice(-6) + Math.floor(100 + Math.random() * 900);
}
/* Human-friendly "ORD-XXXXX" order ID shown throughout the purchase/
   order UI. Derived deterministically from the order's internal id/
   reference so it never changes across re-renders. Purely a display
   label — order.id remains the real lookup key. */
function orderDisplayId(order) {
  const raw = ((order && (order.reference || order.id)) || "").replace(/\D/g, "") || "10000";
  return "ORD-" + raw.slice(-5).padStart(5, "0");
}
/* Formats a 24h "HH:MM" purchase time as a 12h clock string, e.g. "2:32 PM". */
function formatOrderTime(t) {
  if (!t) return "";
  const parts = t.split(":");
  let hh = parseInt(parts[0], 10);
  const mm = parts[1];
  if (isNaN(hh)) return t;
  const ampm = hh >= 12 ? "PM" : "AM";
  hh = hh % 12;
  if (hh === 0) hh = 12;
  return hh + ":" + mm + " " + ampm;
}
function nowTimeHHMM() {
  const d = new Date();
  return String(d.getHours()).padStart(2, "0") + ":" + String(d.getMinutes()).padStart(2, "0");
}
/* ---------------------------------------------------------------- */
/* Cashback helpers — frontend-only preview logic. 20% of the        */
/* successful purchase price. No real balance is stored anywhere.    */
/* ---------------------------------------------------------------- */
const CASHBACK_RATE = 0.2; // 20%
function calcCashback(amount) {
  const n = Number(amount) || 0;
  return Math.round(n * CASHBACK_RATE * 100) / 100;
}
function genWithdrawalReference() {
  return "WD-" + Date.now().toString(36).toUpperCase().slice(-6) + Math.floor(10 + Math.random() * 90);
}
function round2(n) {
  return Math.round((Number(n) || 0) * 100) / 100;
}
/* ---------------------------------------------------------------- */
/* Withdrawal payout reference data.                                 */
/* Real withdrawals go through POST /withdrawals (WalletProvider /    */
/* WithdrawFunds), with real Paystack Transfers now wired in          */
/* server-side (Phase 11). Real bank/Mobile-Money-network codes are    */
/* fetched live from GET /withdrawals/banks — never hardcoded here.    */
/* ---------------------------------------------------------------- */
/* ---------------------------------------------------------------- */
/* Stage 9 — Wallet & Withdrawal helpers. Frontend demonstration     */
/* logic only. The three source balances (Cashback, Commission,      */
/* Reward) always stay separate for transparency, but a withdrawal   */
/* draws from a single combined available balance so the user never  */
/* has to choose which balance to withdraw from. Consumption order:  */
/* 1) Cashback  2) Commission  3) Reward. The future backend must     */
/* perform the authoritative allocation atomically.                  */
/* ---------------------------------------------------------------- */
function calculateWithdrawalAllocation(amount, cashback, commission, reward) {
  let remaining = round2(amount);
  const fromCashback = round2(Math.min(remaining, Math.max(0, cashback)));
  remaining = round2(remaining - fromCashback);
  const fromCommission = round2(Math.min(remaining, Math.max(0, commission)));
  remaining = round2(remaining - fromCommission);
  const fromReward = round2(Math.min(remaining, Math.max(0, reward)));
  remaining = round2(remaining - fromReward);
  return { cashback: fromCashback, commission: fromCommission, reward: fromReward };
}
/* Merges Cashback/Commission/Reward earnings with Withdrawal requests
   into one unified, date-sorted wallet ledger for the "Recent
   Transactions" view. Mirrors the future WalletTransaction shape
   ({ id, type: EARNING|WITHDRAWAL, source, amount, status, date })
   without implying any backend ledger exists yet. */
function buildWalletTransactions({ cashbackTransactions, completedCommissions, rewardHistory, withdrawals }) {
  const earnings = []
    .concat((cashbackTransactions || []).map(t => ({
      id: "wtx_cb_" + t.id, type: "EARNING", source: "CASHBACK",
      label: "Cashback · " + t.productName, amount: t.cashbackAmount, date: t.date, status: "completed"
    })))
    .concat((completedCommissions || []).map(t => ({
      id: "wtx_cm_" + t.id, type: "EARNING", source: "COMMISSION",
      label: "Recommendation Commission · " + t.productName, amount: t.commissionAmount, date: t.date, status: t.status
    })))
    .concat((rewardHistory || []).map(t => ({
      id: "wtx_rw_" + t.id, type: "EARNING", source: "REWARD",
      label: "Promotion Reward · " + t.target + " recommendations", amount: t.rewardAmount, date: t.date, status: "completed"
    })));
  const withdrawalTx = (withdrawals || []).map(w => ({
    id: "wtx_wd_" + w.id, type: "WITHDRAWAL", source: "WITHDRAWAL",
    label: w.method + " Withdrawal", amount: w.amount, date: w.date, status: w.status,
    reference: w.reference, withdrawalId: w.id
  }));
  return [...earnings, ...withdrawalTx].sort((a, b) => (a.date < b.date ? 1 : a.date > b.date ? -1 : 0));
}
/* ---------------------------------------------------------------- */
/* Agent / recommendation commission helpers — frontend-only preview logic.*/
/* 40% of the successful referred purchase amount. No real payout    */
/* or balance is stored anywhere; the future backend must verify     */
/* purchase status, recommendation relationship and amounts independently. */
/* ---------------------------------------------------------------- */
const COMMISSION_RATE = 0.4; // 40%
function calcCommission(amount) {
  return round2((Number(amount) || 0) * COMMISSION_RATE);
}
/* The backend's user response has no "accountId" field (see
   src/models/user.mapper.js toPublicUser) — its real unique account
   identifier is `user.id`. This derives a short display id from that
   real id as a placeholder until the backend issues an actual Agent
   record (GET /agents/me -> agent.agentId), which AgentProvider prefers
   once it's available. Accepts null/undefined safely. */
function agentIdFromAccountId(realUserId) {
  const digits = String(realUserId || "").replace(/\D/g, "") || "100000";
  return "AGT-" + digits.slice(-6).padStart(6, "0");
}

   base URL (never a hard-coded production domain) plus the agent's
   account ID as a hash-route query parameter. */
function buildReferralLink(agentId) {
  const base = (window.location.origin + window.location.pathname).replace(/\/$/, "");
  return base + "/#/?ref=" + agentId;
}

/* ---------------------------------------------------------------- */
/* Verified Promoter + Certificate helpers — frontend-only preview      */
/* logic (Stage 8). Verification is derived from the existing        */
/* successfulReferrals value (Stage 6) — never a second counting      */
/* system — and the certificate is a separate artifact issued at      */
/* Agent activation (first successful purchase), not at verification. */
/* The future backend must independently verify identity, purchases,  */
/* recommendation attribution and verification/certificate ownership; the   */
/* client here is never trusted to simply send isVerified: true.      */
/* ---------------------------------------------------------------- */
const VERIFICATION_THRESHOLD = 20;
function getVerificationProgressLabel(successfulReferrals, threshold = VERIFICATION_THRESHOLD) {
  if (successfulReferrals >= threshold) return "Congratulations! You are now a Verified Promoter.";
  const remaining = threshold - successfulReferrals;
  return remaining + " more successful recommendation" + (remaining === 1 ? "" : "s") + " to become verified.";
}
/* Agent activation date = date of the Agent's FIRST successful product

   date (below) is a separate, later event and must not be confused. */
function getAgentActivatedAt(orders) {
  const dates = orders.filter(o => o.paymentStatus === "SUCCESSFUL" && o.paidAt).map(o => o.paidAt).sort();
  return dates[0] || null;
}
/* Verification date = the date the Agent's Nth (threshold) successful

function getVerifiedAt(completedCommissions, threshold = VERIFICATION_THRESHOLD) {
  if (completedCommissions.length < threshold) return null;
  const sorted = [...completedCommissions].sort((a, b) => (a.date < b.date ? -1 : 1));

function buildCertificateNumber(agentId, activatedAt) {

function parseHashQuery(hash) {

    const dy = bez(t2, p0.y, p1.y, p2.y, p3.y) - y;

  // Load the signed-in user's real orders — GET /orders (order.controller.js
  // listMyOrders). This IS the real source of course ownership: a PAID
  // order with an active enrollment is what "My Courses" is built from.
  // There is no separate "/enrollments" endpoint on this backend.
  const loadOrders = useCallback(() => {
    if (!isLoggedIn) { setOrders([]); return; }
    setOrdersLoading(true);
    apiFetch("/orders?limit=100")
      .then(r => setOrders(r.orders || []))
      .catch(() => setOrders([]))
      .finally(() => setOrdersLoading(false));
  }, [isLoggedIn]);
  useEffect(loadOrders, [loadOrders]);

  // A course is "owned" only when a PAID order exists AND the backend's
  // own enrollment record for it is ACTIVE or COMPLETED (never SUSPENDED).
  // This mirrors src/services/courseAccess.service.js hasCourseAccess
  // exactly — access is never inferred from anything else client-side.
  const enrollments = useMemo(() => orders
    .filter(o => o.status === "PAID" && o.course && (o.enrollmentStatus === "ACTIVE" || o.enrollmentStatus === "COMPLETED"))
    .map(o => ({
      courseId: o.course.id,
      slug: o.course.slug,
      title: o.course.title,
      thumbnail: o.course.thumbnail,
      enrollmentStatus: o.enrollmentStatus,
      orderId: o.id,
      paidAt: o.paidAt,
    })),
  [orders]);

  // isEnrolled accepts either a course slug or a real course id — every
  // call site in this app currently has the slug (used as the frontend's
  // "/products/:id" and "/dashboard/learning/:id" route param).
  const isEnrolled = useCallback(idOrSlug =>
    enrollments.some(e => e.slug === idOrSlug || e.courseId === idOrSlug),
  [enrollments]);

  const getOrder = useCallback(idOrRef =>
    orders.find(o => o.id === idOrRef || o.paymentReference === idOrRef) || null,
  [orders]);

  const ordersForProduct = useCallback(courseIdOrSlug =>
    orders.filter(o => o.course && (o.course.id === courseIdOrSlug || o.course.slug === courseIdOrSlug)),
  [orders]);

  // Real checkout, in the backend's actual two-step shape — there is no
  // combined "/orders/checkout" endpoint:
  //   1) POST /orders { courseId, referralCode } -> creates a PENDING order
  //   2) POST /payments/paystack/initialize { orderId } -> authorizationUrl
  // The caller (Checkout page) is responsible for redirecting the browser
  // to the returned authorizationUrl — Paystack itself collects card/MoMo
  // details on its own hosted page, never in this frontend.
  const createOrderAndInitializePayment = useCallback(async ({ courseId, referralCode }) => {
    const { order } = await apiFetch("/orders", {
      method: "POST",
      body: JSON.stringify({ courseId, referralCode: referralCode || undefined }),
    });
    setOrders(list => [order, ...list]);
    const { authorizationUrl, reference } = await apiFetch("/payments/paystack/initialize", {
      method: "POST",
      body: JSON.stringify({ orderId: order.id }),
    });
    return { order, authorizationUrl, reference };
  }, []);

  // GET /payments/paystack/verify/:reference — independently re-checks the
  // payment against Paystack server-side (never trusts the redirect alone)
  // and returns { status, payment, order }. Refreshes local order state
  // with whatever the backend now says is true.
  const verifyPayment = useCallback(async reference => {
    const result = await apiFetch("/payments/paystack/verify/" + encodeURIComponent(reference));
    setOrders(list => {
      const idx = list.findIndex(o => o.id === result.order.id);
      if (idx === -1) return [result.order, ...list];
      const next = [...list];
      next[idx] = result.order;
      return next;
    });
    return result;
  }, []);

  // --- Phase 4: real course content / access / lesson progress --------

  // GET /courses/:courseId/content (courseId = the real backend id, NOT
  // the slug — see src/routes/courses.routes.js / lesson.controller.js
  // getCourseContent, which looks the course up by id). Works for both
  // authenticated and anonymous callers (optionalAuthenticate): an
  // anonymous or non-owning caller gets hasAccess:false and every
  // non-preview lesson's `content` omitted and `locked:true` — the
  // backend enforces this, not the frontend.
  const fetchCourseContent = useCallback(courseId =>
    apiFetch("/courses/" + courseId + "/content"),
  []);

  // GET /courses/:courseId/lessons/:lessonId — used when a learner opens
  // a specific lesson. For preview lessons this works for anyone; for
  // everything else the backend requires auth + real access and 401s/403s
  // otherwise (src/controllers/lesson.controller.js getLesson). This is
  // also what registers "last viewed" server-side (prismaTouch).
  const fetchLesson = useCallback((courseId, lessonId) =>
    apiFetch("/courses/" + courseId + "/lessons/" + lessonId),
  []);

  // GET /courses/:courseId/progress — requires a real enrollment; the
  // backend itself 403s with "You do not have access to this course."
  // if the caller isn't actually enrolled (progress.service.js
  // getCourseProgress). Cached per course so multiple cards/pages don't
  // all refetch independently.
  const loadCourseProgress = useCallback((courseId) => {
    setProgressByCourse(s => ({ ...s, [courseId]: { ...(s[courseId] || {}), loading: true, error: null } }));
    return apiFetch("/courses/" + courseId + "/progress")
      .then(r => {
        setProgressByCourse(s => ({ ...s, [courseId]: { loading: false, error: null, summary: r.progress } }));
        return r.progress;
      })
      .catch(err => {
        setProgressByCourse(s => ({ ...s, [courseId]: { loading: false, error: err, summary: null } }));
        throw err;
      });
  }, []);

  // POST /courses/:courseId/lessons/:lessonId/complete — the ONLY real
  // way to mark a lesson complete (progress.service.js markLessonComplete).
  // The response IS the fresh authoritative progress summary; we store
  // that directly rather than guessing/incrementing a local counter.
  const completeLesson = useCallback((courseId, lessonId) =>
    apiFetch("/courses/" + courseId + "/lessons/" + lessonId + "/complete", { method: "POST" })
      .then(r => {
        setProgressByCourse(s => ({ ...s, [courseId]: { loading: false, error: null, summary: r.progress } }));
        return r.progress;
      }),
  []);

  return h(OrdersCtx.Provider, {
    value: {
      orders, ordersLoading, isEnrolled, getOrder, ordersForProduct, enrollments,
      createOrderAndInitializePayment, verifyPayment,
      progressByCourse, fetchCourseContent, fetchLesson, loadCourseProgress, completeLesson,
    }
  }, children);
}
function useOrders() {
  return useContext(OrdersCtx);
}

/* ---------------------------------------------------------------- */
/* Agent context — frontend-only. Agent status is DERIVED (a user    */
/* becomes an Agent the moment they have one successful order, and   */
/* simply stays one — no separate account, no separate login). The   */
/* recommendation funnel/commission numbers below are seeded demo data,    */
/* since a single-account preview can't literally simulate a second  */
/* person buying through this agent's link end-to-end. A "simulate a */
/* recommendation sale" preview action is provided on the dashboard so the */
/* commission balance can be seen updating live.                     */
/* ---------------------------------------------------------------- */
const AgentCtx = createContext(null);
function AgentProvider({ children }) {
  const { user, isLoggedIn } = useAuth();
  const { orders } = useOrders();
  const [commissions, setCommissions] = useState([]);
  const [onboardingDismissed, setOnboardingDismissed] = useState(false);
  const [rewardTransactions, setRewardTransactions] = useState([]);
  const [currentPeriodTierIndex, setCurrentPeriodTierIndex] = useState(-1);
  // agentId is derived from the real, authenticated user (user.id — the
  // backend's actual unique account identifier; there is no "accountId"
  // field on the backend's response, see src/models/user.mapper.js
  // toPublicUser). It starts out null and is only computed once a real
  // user is present, which also covers: logged out, still loading, and
  // the backend returning no user.
  const [agentId, setAgentId] = useState(null);

  useEffect(() => {
    setAgentId(user ? agentIdFromAccountId(user.id) : null);
  }, [user]);

  // Load this user's real commissions + reward history + canonical agent id
  // from the backend (GET /agents/me — 404s harmlessly until this account
  // has an actual Agent record, which is fine: agentId then just stays the
  // client-derived value above).
  useEffect(() => {
    if (!isLoggedIn) { setCommissions([]); setRewardTransactions([]); return; }
    apiFetch("/agents/me").then(r => {
      if (r && r.agent && r.agent.agentId) setAgentId(r.agent.agentId);
    }).catch(() => {});
    // Real shape (finance.mapper.js toPublicTransaction): {amount, status:
    // PENDING|SUCCESSFUL|FAILED, description, createdAt, ...} — no
    // commissionAmount/purchaseAmount/date fields exist on a Transaction,
    // so those are aliased here rather than guessed at every call site.
    apiFetch("/users/me/commissions").then(r => setCommissions((r.commissions || []).map(c => ({
      ...c,
      status: c.status === "SUCCESSFUL" ? "completed" : c.status === "PENDING" ? "pending" : "failed",
      commissionAmount: c.amount,
      purchaseAmount: null, // not available on a Transaction record
      date: c.createdAt,
    })))).catch(() => {});
    apiFetch("/users/me/rewards").then(r => setRewardTransactions((r.rewards || []).map(rw => ({
      ...rw,
      status: rw.status === "SUCCESSFUL" ? "rewarded" : "reversed",
      rewardAmount: rw.amount,
      date: rw.createdAt,
    })))).catch(() => {});
  }, [isLoggedIn]);

  const isAgent = orders.some(o => o.paymentStatus === "SUCCESSFUL");
  const referralLink = agentId ? buildReferralLink(agentId) : "";
  const qrCodeUrl = agentId ? buildQrCodeUrl(referralLink) : "";

  const completedCommissions = useMemo(() => commissions.filter(c => c.status === "completed"), [commissions]);
  const totalCommission = round2(completedCommissions.reduce((s, c) => s + (c.commissionAmount || 0), 0));
  const totalSales = round2(completedCommissions.reduce((s, c) => s + (c.purchaseAmount || 0), 0));
  /* successfulReferrals = referred people whose purchase actually completed.
     Clicks, signups, failed/cancelled/abandoned checkouts never count —
     this is the single source of truth the promotion system reads from. */
  const successfulReferrals = completedCommissions.length;
  const productsSold = successfulReferrals;
  /* Funnel-level counts (link opens, sign-ups) aren't tracked by the
     backend at all — no click/signup-tracking capability exists (see
     Phase 6/9 audit). Rather than showing a fabricated number, these are
     null ("not tracked") and every display site below shows that
     honestly instead of a fake count. conversionRate is real where it
     CAN be computed (successfulReferrals is real), but with no real
     denominator to compare against, it's also left unavailable. */
  const totalReferralClicks = null;
  const totalSignups = null;
  const conversionRate = null;

  const addCommission = useCallback(tx => setCommissions(list => [tx, ...list]), []);
  const dismissOnboarding = useCallback(() => setOnboardingDismissed(true), []);

  /* ---- Promotion targets / Reward Balance (Stage 7) ---- */
  const promotionPeriod = useMemo(() => getPromotionPeriod(new Date()), []);
  const achievedTierIndex = getAchievedTierIndex(successfulReferrals);
  const nextTier = achievedTierIndex + 1 < TARGET_TIERS.length ? TARGET_TIERS[achievedTierIndex + 1] : null;
  const topTargetReached = achievedTierIndex === TARGET_TIERS.length - 1;

  const rewardHistory = useMemo(
    () => [...rewardTransactions].sort((a, b) => (a.date < b.date ? 1 : -1)),
    [rewardTransactions]
  );
  const rewardBalance = round2(
    rewardTransactions.filter(t => t.status === "rewarded").reduce((s, t) => s + t.rewardAmount, 0)
  );

  /* Records (or upgrades) THIS period's reward when a new tier is reached.
     Tiers are achievement levels, not stacked payouts — reaching 20
     replaces the 10/15 record for the current period rather than adding
     GH₵50 + GH₵75 + GH₵100. Never fires twice for the same tier. */
  const recordCurrentPeriodReward = useCallback((tierIndex) => {
    const tier = TARGET_TIERS[tierIndex];
    if (!tier) return;
    setRewardTransactions(list => {
      const withoutCurrentPeriod = list.filter(t => !t.isCurrentPeriod);
      const tx = {
        id: "rw_" + Date.now(),
        agentId,
        target: tier.recommendations,
        successfulReferrals,
        rewardAmount: tier.reward,
        promotionPeriodStart: promotionPeriod.startISO,
        promotionPeriodEnd: promotionPeriod.endISO,
        status: "rewarded",
        date: new Date().toISOString().slice(0, 10),
        isCurrentPeriod: true
      };
      return [tx, ...withoutCurrentPeriod];
    });
    setCurrentPeriodTierIndex(tierIndex);
  }, [agentId, successfulReferrals, promotionPeriod]);

  /* ---- Verified Promoter status (Stage 8) ----
     Reuses successfulReferrals (Stage 6) as the single source of truth —
     no separate counter. Once true, verification stays true even if the
     weekly promotion counters (Stage 7) reset; it only ever moves forward
     as successfulReferrals grows, and is never toggled off client-side. */
  const isVerified = successfulReferrals >= VERIFICATION_THRESHOLD;
  const verificationRemaining = Math.max(0, VERIFICATION_THRESHOLD - successfulReferrals);
  const verificationPct = Math.round((Math.min(successfulReferrals, VERIFICATION_THRESHOLD) / VERIFICATION_THRESHOLD) * 100);
  const verificationMessage = getVerificationProgressLabel(successfulReferrals);
  const verifiedAt = useMemo(
    () => getVerifiedAt(completedCommissions),
    [completedCommissions]
  );
  /* USER -> AGENT -> VERIFIED AGENT. Same account throughout; this is a
     status label derived from existing state, not a second account/ID. */
  const accountStatusLabel = isVerified ? "VERIFIED AGENT" : isAgent ? "AGENT" : "USER";

  /* ---- Agent Certificate (Stage 8) ----
     Issued at Agent activation (first successful purchase) — separate
     from, and independent of, verification (20 successful recommendations). */
  const agentActivatedAt = useMemo(() => getAgentActivatedAt(orders), [orders]);
  const hasCertificate = isAgent;
  const certificateNumber = useMemo(
    () => buildCertificateNumber(agentId, agentActivatedAt),
    [agentId, agentActivatedAt]
  );

  return h(AgentCtx.Provider, {
    value: {
      isAgent, agentId, referralLink, qrCodeUrl,
      commissions, completedCommissions, addCommission,
      totalCommission, totalSales, successfulReferrals, productsSold,
      totalReferralClicks, totalSignups, conversionRate,
      onboardingDismissed, dismissOnboarding,
      promotionPeriod, achievedTierIndex, nextTier, topTargetReached,
      currentPeriodTierIndex, rewardTransactions, rewardHistory, rewardBalance,
      recordCurrentPeriodReward,
      isVerified, verificationRemaining, verificationPct, verificationMessage, verifiedAt, accountStatusLabel,
      agentActivatedAt, hasCertificate, certificateNumber
    }
  }, children);
}
function useAgent() {
  return useContext(AgentCtx);
}

/* ------------------------------------------------------------------ */
/* Wallet context (Stage 9) — frontend-only. Combines the three        */
/* separate source balances (Cashback, Commission, Reward) into ONE    */
/* available balance for withdrawal purposes, while keeping each       */
/* source balance visible and distinct for transparency. Withdrawals   */
/* are drawn from eligible balances in priority order (Cashback →      */
/* Commission → Reward) via calculateWithdrawalAllocation(). This is   */
/* demonstration logic only — the future backend must independently    */
/* and atomically verify balances and perform the real allocation.     */
/* ------------------------------------------------------------------ */
const WalletCtx = createContext(null);
function WalletProvider({ children }) {
  const { isLoggedIn } = useAuth();
  const [balances, setBalances] = useState({ cashbackBalance: 0, commissionBalance: 0, rewardBalance: 0, availableWithdrawalBalance: 0 });
  const [balancesLoading, setBalancesLoading] = useState(false);
  const [withdrawals, setWithdrawals] = useState([]);
  const [withdrawalsLoading, setWithdrawalsLoading] = useState(false);
  const [cashbackTransactions, setCashbackTransactions] = useState([]);
  const [cashbackLoading, setCashbackLoading] = useState(false);
  const [transactions, setTransactions] = useState([]);

// Reached after Paystack redirects back from its hosted payment page.
// Real backend route configured via PAYSTACK_CALLBACK_URL should point
// here (e.g. "<frontend-origin>/#/checkout/callback") so Paystack's
// ?trxref=...&reference=... query string lands in this page's hash query.
// Independently re-verifies via GET /payments/paystack/verify/:reference
// — never trusts the redirect itself as proof of payment.
function CheckoutCallback({ query }) {
  const { verifyPayment } = useOrders();
  const [state, setState] = useState({ loading: true, error: null, status: null, order: null });
  const reference = query.get("reference") || query.get("trxref") || "";

  const runVerify = useCallback(() => {
    if (!reference) { setState({ loading: false, error: "Missing payment reference.", status: null, order: null }); return; }
    setState(s => ({ ...s, loading: true, error: null }));
    verifyPayment(reference)
      .then(r => setState({ loading: false, error: null, status: r.status, order: r.order }))
      .catch(err => setState({ loading: false, error: err.message, status: null, order: null }));
  }, [reference, verifyPayment]);
  useEffect(runVerify, [runVerify]);

  const [product, setProduct] = useState(null);
  useEffect(() => {
    if (state.order && state.order.course) {
      apiFetch("/courses/" + state.order.course.slug).then(r => setProduct(mapCourseDetail(r.course))).catch(() => {});
    }
  }, [state.order]);

  return h("div", { className: "container-page py8", style: { maxWidth: 900 } },
    state.loading
      ? h(PaymentProcessing, { label: "Verifying your payment with Paystack…" })
      : state.error
        ? h("div", { style: { maxWidth: 460, margin: "0 auto" } }, h(CatalogError, { title: "Couldn't verify this payment.", description: state.error, onRetry: runVerify }))
        : state.status === "SUCCESS"
          ? h(PaymentSuccess, { order: state.order, product })
          : h(PaymentPendingScreen, { status: state.status, order: state.order }));
}

function Checkout({ params }) {
  const { isLoggedIn, user } = useAuth();
  const { isEnrolled, createOrderAndInitializePayment } = useOrders();
  const { agentId: myAgentId } = useAgent();
  const { referrerId } = useReferral();
  const { toast } = useToast();
  const [submitting, setSubmitting] = useState(false);
  const [payError, setPayError] = useState(null);

  const [courseState, setCourseState] = useState({ loading: true, error: null, notFound: false, course: null });
  const loadCourse = useCallback(() => {
    setCourseState(s => ({ ...s, loading: true, error: null, notFound: false }));
    apiFetch("/courses/" + params.id)
      .then(r => setCourseState({ loading: false, error: null, notFound: false, course: mapCourseDetail(r.course) }))
      .catch(err => {
        if (err.status === 404) setCourseState({ loading: false, error: null, notFound: true, course: null });
        else setCourseState({ loading: false, error: err.message, notFound: false, course: null });
      });
  }, [params.id]);
  useEffect(loadCourse, [loadCourse]);
  const product = courseState.course;

  if (courseState.loading) {
    return h("div", { className: "container-page py8" }, h(CatalogLoading, { label: "Loading checkout…", height: 320 }));
  }
  if (courseState.notFound) return h(ProductNotFound, null);
  if (courseState.error) {
    return h("div", { className: "container-page py8" }, h(CatalogError, { title: "Couldn't load this product.", description: courseState.error, onRetry: loadCourse }));
  }

  // Self-attribution is never counted — an agent can't earn commission
  // from their own purchase. The backend re-checks this independently
  // (order.service.js createOrder), this only avoids sending it at all.
  const isSelfReferral = !!(referrerId && referrerId === myAgentId);
  const effectiveReferrerId = referrerId && !isSelfReferral ? referrerId : null;

  const startPayment = () => {
    setSubmitting(true);
    setPayError(null);
    createOrderAndInitializePayment({ courseId: product.realId, referralCode: effectiveReferrerId })
      .then(({ authorizationUrl }) => {
        // Full-page redirect to Paystack's own hosted checkout — this
        // leaves the SPA entirely, exactly like the real integration
        // requires (Paystack collects card/MoMo details on its page,
        // never in this frontend). Paystack redirects back to whatever

  } else {

        (effectiveReferrerId || isSelfReferral) && h("div", { className: "card p4 flex items-center g3", style: { background: isSelfReferral ? "#FAF5E9" : "#EAF3EE", border: "1px solid " + (isSelfReferral ? "rgba(185,137,0,.4)" : "rgba(20,107,79,.25)") } },
          h(Icon, { name: isSelfReferral ? "alertTriangle" : "link", size: 15, style: { color: isSelfReferral ? "var(--goldDeep)" : "var(--blueDeep)", flexShrink: 0 } }),
          h("p", { className: "text-xs", style: { color: isSelfReferral ? "var(--goldDeep)" : "var(--blueDeep)", lineHeight: 1.5 } },
            isSelfReferral ? "This is your own recommendation link — this purchase won't earn recommendation commission." : "Recommendation applied — this purchase will be attributed to " + effectiveReferrerId + ".")),
        h(CustomerInfoCard, { user }),
        h(PaymentMethodCard, null)),
      h(OrderSummaryCard, { product, onPay: startPayment, submitting, error: payError }));
  }

  return h("div", { className: "container-page py8", style: { maxWidth: 900 } },
    h(Link, { to: "/products/" + product.id, className: "text-xs muted flex items-center g1 mb4" }, h(Icon, { name: "chevronLeft", size: 13 }), " Back to product"),

/* Watches successfulReferrals and records/upgrades the current
   period's reward the moment a new tier is crossed, firing an
   achievement toast + a reward-credit toast. Mount this once per
   page that shows reward/promotion data (AgentDashboard,
   PromotionTargetsPage) — it's idempotent, since it only acts when
   achievedTierIndex has moved past currentPeriodTierIndex. */
function usePromotionAchievementWatcher() {
  const { toast } = useToast();
  const { achievedTierIndex, currentPeriodTierIndex, recordCurrentPeriodReward, successfulReferrals } = useAgent();
  useEffect(() => {
    if (achievedTierIndex >= 0 && achievedTierIndex > currentPeriodTierIndex) {
      const tier = TARGET_TIERS[achievedTierIndex];
      recordCurrentPeriodReward(achievedTierIndex);
      toast({
        type: "success",
        title: "Target Achieved!",
        description: "You successfully helped " + successfulReferrals + " people purchase products through your recommendations. You've unlocked a " + formatGHS(tier.reward) + " promotion reward."
      });
      setTimeout(() => {
        toast({ type: "success", title: "Reward Added", description: formatGHS(tier.reward) + " has been added to your Reward Balance." });
      }, 300);
    }
    // eslint-disable-next-line react-hooks/exhaustive-deps
  }, [achievedTierIndex, currentPeriodTierIndex]);
}

// Write-a-review card — POST /courses/:courseId/reviews (upsert: a
// second submission from the same person updates their existing review
// rather than creating a duplicate, per src/services/review.service.js).
function WriteReviewForm({ courseId, onSubmitted }) {
  const [rating, setRating] = useState(0);
  const [title, setTitle] = useState("");
  const [comment, setComment] = useState("");
  const [status, setStatus] = useState("idle"); // idle | submitting
  const [error, setError] = useState("");
  const { toast } = useToast();

  const submit = e => {
    e.preventDefault();
    if (!rating) { setError("Choose a star rating."); return; }
    setStatus("submitting");
    setError("");
    apiFetch("/courses/" + courseId + "/reviews", {
      method: "POST",
      body: JSON.stringify({ rating, title: title.trim() || undefined, comment: comment.trim() || undefined }),
    })
      .then(r => {
        setStatus("idle");
        toast({ type: "success", title: "Review saved" });
        onSubmitted(r.review);
      })
      .catch(err => {
        setStatus("idle");
        // Real backend responses this can surface: 403 "Only users who
        // have purchased this course may leave a review.", 401 unauthenticated,
        // 422 validation (rating out of range).
        setError(err.message || "Couldn't save your review.");
      });
  };

  return h("form", { className: "card p4", onSubmit: submit },
    h("p", { className: "font-display font-semibold text-sm mb3" }, "Write a review"),
    h(StarRatingInput, { value: rating, onChange: setRating }),
    h(Input, {
      id: "reviewTitle",
      label: "Title (optional)",
      placeholder: "Sum it up in a few words",
      value: title,
      onChange: e => setTitle(e.target.value),
      className: "mt3"
    }),
    h("div", { className: "mt3" },
      h("label", { className: "label-field", htmlFor: "reviewComment" }, "Comment (optional)"),
      h("textarea", {
        id: "reviewComment",
        className: "input-field",
        rows: 3,
        value: comment,
        onChange: e => setComment(e.target.value)
      })
    ),
    error && h("p", { className: "text-xs text-red mt2" }, error),
    h("button", {
      type: "submit",
      className: "btn btn-primary btn-md mt3",
      disabled: status === "submitting"
    }, status === "submitting" ? "Saving…" : "Submit Review")
  );
}

function EarningsSparkline({ points }) {
  const w = 320, hgt = 90;
  const max = Math.max(...points), min = Math.min(...points);
  const range = max - min || 1;
  const step = w / (points.length - 1);
  const coords = points.map((p, i) => [i * step, hgt - ((p - min) / range) * (hgt - 10) - 5]);
  const line = coords.map((c, i) => (i === 0 ? "M" : "L") + c[0].toFixed(1) + " " + c[1].toFixed(1)).join(" ");
  const area = line + " L " + w + " " + hgt + " L 0 " + hgt + " Z";

    h("path", { d: area, fill: "url(#earnGrad)" }),
